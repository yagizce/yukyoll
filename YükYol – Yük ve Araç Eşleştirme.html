function openCalc(){const m=$("#sheetBody");m.dataset.k="";
    const num=(k,t,u)=>`<div><label>${t}</label><div class="unit"><input data-k="${k}" type="number" inputmode="decimal" value="${calc[k]}"><em>${u}</em></div></div>`;
    const cur=vehicles.find(v=>CONS[v]===calc.cons)||"";
    m.innerHTML=`<div style="display:flex;justify-content:space-between;align-items:center;margin-bottom:12px"><b style="font-size:19px">Yakıt hesabı</b><button class="chip" id="cx">Kapat</button></div><div class="res" id="res"></div>
    <label>Araç tipi</label><select id="cv"><option value="" hidden>Özel</option>${vehicles.map(v=>`<option ${v===cur?"selected":""}>${v}</option>`).join("")}</select>
    <div class="row">${num("km","Mesafe","km")}${num("fare","Navlun","₺")}</div>
    <details class="more"><summary>Diğer ayarlar</summary>
      <p style="font-size:12px;color:var(--mute);margin-top:12px">Mazot: İstanbul pompa fiyatı, 4 Ekim 2026. Fiyat değişirse buradan güncelle.</p><div class="row">${num("fuel","Mazot","₺/L")}${num("cons","Tüketim","L/100km")}</div>
      <div class="row">${num("toll","Otoyol","₺")}${num("other","Diğer","₺")}</div>
      <label class="chk"><input type="checkbox" id="bk" ${calc.back?"checked":""}>Dönüşte boş döneceğim</label>
    </details>`;
    const out=()=>{
      const d=calc.km*(calc.back?2:1),fc=Math.round(d*calc.cons/100*calc.fuel),cost=fc+calc.toll+calc.other,net=Math.round(calc.fare-cost),pc=x=>Math.round(x/Math.max(cost,1)*100);
      $("#res").innerHTML=`<span>Net kazanç</span><div class="big ${net<0?"bad":""}">${fmt(net)}</div><div class="sub">Masraf ${fmt(Math.round(cost))} · ${d?Math.round(net/d)+" ₺/km":"—"}</div>
      <div class="bar"><i style="width:${pc(fc)}%;background:var(--accent)"></i><i style="width:${pc(calc.toll)}%;background:#fff"></i><i style="width:${pc(calc.other)}%;background:rgba(255,255,255,.4)"></i></div>
      <div class="leg"><span><b style="background:var(--accent)"></b>Yakıt ${fmt(fc)}</span><span><b style="background:#fff"></b>Otoyol ${fmt(calc.toll)}</span><span><b style="background:rgba(255,255,255,.4)"></b>Diğer ${fmt(calc.other)}</span></div>`};
    m.querySelectorAll("[data-k]").forEach(i=>i.oninput=()=>{calc[i.dataset.k]=+i.value||0;if(i.dataset.k==="cons")$("#cv").value=vehicles.find(v=>CONS[v]===calc.cons)||"";out();save()});
    $("#cv").onchange=e=>{calc.cons=CONS[e.target.value];m.querySelector('[data-k="cons"]').value=calc.cons;out();save()};
    $("#bk").onchange=e=>{calc.back=e.target.checked;out();save()};
    out();$("#cx").onclick=closeSheet;$("#sheet").classList.add("open")}
function closeSheet(){if(unChat){unChat();unChat=null}$("#sheetBody").dataset.k="";$("#sheet").classList.remove("open")}
$("#sheet").onclick=e=>{if(e.target.id==="sheet"){closeSheet();render()}};
function setNav(){document.querySelectorAll("nav button").forEach(b=>b.classList.toggle("on",b.dataset.t===tab))}
document.querySelectorAll("nav button").forEach(b=>b.onclick=()=>{tab=b.dataset.t;setNav();render();$("#main").scrollTop=0});
render();
(async()=>{try{
  if(!window.claude||!claude.use)return;
  const [d,u]=await Promise.all([claude.use("db"),claude.use("user")]);
  if(!d||!u)return;
  me=await u.id();if(!me)return;
  db=d;cloud=true;myName=esc((await u.me()).name||"");names[me]=myName||"Ben";
  $("#sub").textContent="Canlı: ortak ilan havuzu";
  const ts=(a,b)=>(b.ts||0)-(a.ts||0)||String(a.id).localeCompare(String(b.id),"tr",{numeric:true});
  const who=async list=>{const ids=[...new Set(list.filter(Boolean))].filter(i=>!names[i]);if(!ids.length)return;const pr=await u.profiles(ids);ids.forEach(i=>names[i]=esc((pr[i]&&pr[i].name)||"")||"Kullanıcı");render()};
  const sim=new Set();
  db.collection("loads").onSnapshot(sn=>{loads=sn.docs.map(x=>clean(x.data())).sort(ts);who(loads.map(l=>l.uid));rebuild();render()},()=>{});
  db.collection("trucks").onSnapshot(sn=>{trucks=sn.docs.map(x=>clean(x.data())).sort(ts);who(trucks.map(t=>t.uid));render()},()=>{});
  db.collection("offers").onSnapshot(sn=>{allO=sn.docs.map(x=>x.data());rebuild();offers.filter(o=>o.status==="wait"&&!o.ownerUid&&!sim.has(o.id)).forEach(o=>{sim.add(o.id);simulate(o.id)});render()},()=>{});
  let first=true;db.collection("carriers").onSnapshot(sn=>{carriers={};sn.docs.forEach(x=>{const v=x.data();carriers[x.id]={ok:v.ok===true,lic:esc(v.lic||""),src:!!v.src,kb:!!v.kb,ruh:!!v.ruh,docs:{src:!!(v.docs&&v.docs.src),kb:!!(v.docs&&v.docs.kb),ruh:!!(v.docs&&v.docs.ruh)}}});if(first){if(carriers[me])myCar={...carriers[me]};first=false}who(Object.keys(carriers));render()},()=>{});
  admin=await u.isOwner();db.collection("approvals").onSnapshot(sn=>{appr={};sn.docs.forEach(x=>{appr[x.id]=x.data().ok===true});render()},()=>{});
  const ps=await db.doc("data/users/"+me+"/prefs").get();
  if(ps.exists){const v=ps.data();favs=Array.isArray(v.favs)?v.favs.map(String):[];if(v.calc)calc={...calc,...v.calc}}
  lastP=JSON.stringify({favs,calc});render();
}catch(e){}})();
</script>
